version: '3.8'

services:
  backend:
    image: nguyen0811/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://admin:123@cluster0.j7kwbru.mongodb.net/cloud_lab?retryWrites=true&w=majority
      - MONGODB_URI=mongodb+srv://admin:123@cluster0.j7kwbru.mongodb.net/cloud_lab?retryWrites=true&w=majority
